
<h2 class="sr-only">IAP — Inteligência de Acessibilidade Petrobras, protótipo navegável com 4 perfis de usuário</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#app{min-height:600px;background:var(--color-background-tertiary)}
.sidebar{width:220px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;padding:0}
.topbar{height:52px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;padding:0 20px;gap:12px}
.layout{display:flex;min-height:548px}
.content{flex:1;padding:24px;overflow:auto}
.logo{font-size:15px;font-weight:500;color:var(--color-text-primary);letter-spacing:-.3px}
.logo span{color:var(--color-text-info)}
.nav-section{padding:12px 8px 4px;font-size:11px;color:var(--color-text-tertiary);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--border-radius-md);cursor:pointer;font-size:13px;color:var(--color-text-secondary);margin:1px 8px;transition:background .1s}
.nav-item:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.nav-item.active{background:var(--color-background-info);color:var(--color-text-info);font-weight:500}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.badge{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--color-background-danger);color:var(--color-text-danger);margin-left:auto}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px 20px}
.metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:14px 16px}
.metric-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.metric-value{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.metric-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.section-title{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:12px}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.tag-warn{background:var(--color-background-warning);color:var(--color-text-warning)}
.tag-ok{background:var(--color-background-success);color:var(--color-text-success)}
.tag-info{background:var(--color-background-info);color:var(--color-text-info)}
.tag-err{background:var(--color-background-danger);color:var(--color-text-danger)}
.tag-gray{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.row:last-child{border-bottom:none}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.av-blue{background:var(--color-background-info);color:var(--color-text-info)}
.av-green{background:var(--color-background-success);color:var(--color-text-success)}
.av-warn{background:var(--color-background-warning);color:var(--color-text-warning)}
.av-purple{background:#EEEDFE;color:#3C3489}
.page{display:none}
.page.active{display:block}
.profile-tab{padding:6px 14px;border-radius:var(--border-radius-md);cursor:pointer;font-size:12px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);transition:all .15s}
.profile-tab.sel{background:var(--color-background-info);color:var(--color-text-info);border-color:transparent;font-weight:500}
.bar-bg{height:6px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:3px;background:var(--color-text-info)}
.alert-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:var(--border-radius-md);margin-bottom:6px}
.alert-crit{background:#FCEBEB;border-left:3px solid #E24B4A;border-radius:0}
.alert-warn{background:var(--color-background-warning);border-left:3px solid #BA7517;border-radius:0}
.alert-ok{background:var(--color-background-success);border-left:3px solid #3B6D11;border-radius:0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.dot-red{background:#E24B4A}
.dot-amber{background:#EF9F27}
.dot-green{background:#639922}
.acc-control{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.acc-control:last-child{border-bottom:none}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:var(--color-border-tertiary);border-radius:20px;transition:.2s}
.tslider:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}
.toggle input:checked+.tslider{background:var(--color-text-info)}
.toggle input:checked+.tslider:before{transform:translateX(16px)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary)}
.chip.sel{border-color:var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info)}
.form-row{margin-bottom:14px}
.form-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;display:block}
.form-input{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
.form-textarea{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);min-height:80px;resize:vertical}
.btn-primary{padding:8px 16px;font-size:13px;font-weight:500;background:var(--color-text-info);color:white;border:none;border-radius:var(--border-radius-md);cursor:pointer}
.btn-sec{padding:8px 16px;font-size:13px;background:var(--color-background-primary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer}
.toast{position:absolute;bottom:16px;right:16px;padding:10px 16px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:13px;color:var(--color-text-primary);opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:none}
.toast.show{opacity:1}
.sensor-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
</style>

<div id="app" style="border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid var(--color-border-tertiary);position:relative">

<div class="topbar">
  <div class="logo">IAP <span>·</span> Petrobras</div>
  <div style="flex:1"></div>
  <div style="display:flex;gap:6px" id="profile-tabs">
    <button class="profile-tab sel" onclick="switchProfile('funcionario',this)">Funcionário</button>
    <button class="profile-tab" onclick="switchProfile('gestor',this)">Gestor</button>
    <button class="profile-tab" onclick="switchProfile('rh',this)">RH</button>

  </div>
  <div style="width:32px;height:32px;border-radius:50%;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--color-text-info);cursor:pointer" id="user-avatar">MF</div>
</div>

<div class="layout">

<div class="sidebar" id="sidebar"></div>

<div class="content" id="content"></div>

</div>
<div class="toast" id="toast"></div>
</div>

    nav:[
      {icon:"◎",label:"Início",page:"dash"},
      {icon:"◈",label:"Minhas demandas",page:"demandas",badge:2},
      {icon:"◉",label:"Nova demanda",page:"nova"},
      {icon:"◑",label:"Recursos",page:"recursos"},
      {icon:"◐",label:"Acessibilidade",page:"acessibilidade"},
    ]
  },
  gestor:{

    nav:[
      {icon:"◎",label:"Painel do setor",page:"dash"},
      {icon:"◈",label:"Demandas",page:"demandas",badge:5},
      {icon:"◉",label:"Alertas",page:"alertas",badge:1},
      {icon:"◑",label:"Relatórios",page:"relatorios"},
      {icon:"◐",label:"Acessibilidade",page:"acessibilidade"},
    ]
  },
  rh:{
    name:"Ana Paula",initials:"AP",role:"Analista · RH",
    nav:[
      {icon:"◎",label:"Painel RH",page:"dash"},
      {icon:"◈",label:"Todas demandas",page:"demandas"},
      {icon:"◉",label:"Funcionários",page:"funcionarios"},
      {icon:"◑",label:"Relatórios",page:"relatorios"},
      {icon:"◐",label:"Acessibilidade",page:"acessibilidade"},
    ]
  },
  admin:{
    name:"Roberto Souza",initials:"RS",role:"Administrador · TI",
    nav:[
      {icon:"◎",label:"Visão geral",page:"dash"},
      {icon:"◈",label:"Sensores",page:"sensores"},
      {icon:"◉",label:"Usuários",page:"usuarios"},
      {icon:"◑",label:"Auditoria",page:"auditoria"},
      {icon:"◐",label:"Acessibilidade",page:"acessibilidade"},
    ]
  }
};

let currentProfile="funcionario";
let currentPage="dash";
let accSettings={contraste:"normal",tema:"claro",fonte:100,narracao:100,libras:false,reducao:false};

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

function switchProfile(p,btn){
  currentProfile=p;currentPage="dash";
  document.querySelectorAll(".profile-tab").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
  const av=document.getElementById("user-avatar");
  av.textContent=profiles[p].initials;
  renderSidebar();renderContent();
}

function goPage(page){currentPage=page;renderSidebar();renderContent();}

function renderSidebar(){
  const p=profiles[currentProfile];
  const sidebar=document.getElementById("sidebar");
  sidebar.innerHTML=`
    <div style="padding:16px 12px 8px">
      <div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--border-radius-md);background:var(--color-background-secondary)">
        <div class="avatar av-blue" style="width:28px;height:28px;font-size:10px">${p.initials}</div>
        <div><div style="font-size:12px;font-weight:500;color:var(--color-text-primary)">${p.name}</div><div style="font-size:10px;color:var(--color-text-tertiary)">${p.role}</div></div>
      </div>
    </div>
    <div style="padding:0 0 8px">
      ${p.nav.map(n=>`
        <div class="nav-item ${currentPage===n.page?"active":""}" onclick="goPage('${n.page}')">
          <span style="font-size:14px">${n.icon}</span>
          <span style="flex:1">${n.label}</span>
          ${n.badge?`<span class="badge">${n.badge}</span>`:""}
        </div>
      `).join("")}
    </div>
    <div style="margin-top:auto;padding:12px 8px;border-top:0.5px solid var(--color-border-tertiary)">
      <div class="nav-item" onclick="toast('Saindo do sistema...')"><span style="font-size:14px">◁</span>Sair</div>
    </div>
  `;
}

function renderContent(){
  const el=document.getElementById("content");
  const pages={
    dash:renderDash,
    demandas:renderDemandas,
    nova:renderNova,
    recursos:renderRecursos,
    acessibilidade:renderAcessibilidade,
    alertas:renderAlertas,
    relatorios:renderRelatorios,
    funcionarios:renderFuncionarios,
    sensores:renderSensores,
    usuarios:renderUsuarios,
    auditoria:renderAuditoria,
  };
  el.innerHTML=(pages[currentPage]||renderDash)();
}

function renderDash(){
  if(currentProfile==="funcionario") return `
    <div style="margin-bottom:20px">
      <div style="font-size:18px;font-weight:500;margin-bottom:2px">Bom dia, Maria</div>
      <div style="font-size:13px;color:var(--color-text-secondary)">Você tem 2 demandas em andamento</div>
    </div>
    <div class="grid4" style="margin-bottom:20px">
      <div class="metric"><div class="metric-label">Demandas abertas</div><div class="metric-value">2</div><div class="metric-sub">1 aguardando resposta</div></div>

        <div class="row"><div class="avatar av-blue">i</div><div style="flex:1"><div style="font-size:13px;font-weight:500">Solicitação de intérprete LIBRAS</div><div style="font-size:11px;color:var(--color-text-secondary)">Aberta há 5 dias</div></div><span class="tag tag-info">Aguardando</span></div>

      <div class="metric"><div class="metric-label">Resolvidas no mês</div><div class="metric-value">31</div><div class="metric-sub">Meta: 28</div></div>
      <div class="metric"><div class="metric-label">Tempo médio</div><div class="metric-value">2,8d</div><div class="metric-sub">Abaixo da meta</div></div>
      <div class="metric"><div class="metric-label">SLA cumprido</div><div class="metric-value">89%</div><div class="metric-sub">Meta: 85%</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="section-title">Demandas por tipo</div>
        ${[["Rampas e acessos",72],["Intérprete LIBRAS",45],["Equipamentos",38],["Documentação",28],["Outros",17]].map(([l,v])=>`
          <div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${l}</span><span style="color:var(--color-text-secondary)">${v}%</span></div><div class="bar-bg"><div class="bar-fill" style="width:${v}%"></div></div></div>`).join("")}

  return `
    <div style="margin-bottom:20px"><div style="font-size:18px;font-weight:500;margin-bottom:2px">Visão geral do sistema</div><div style="font-size:13px;color:var(--color-text-secondary)">Status em tempo real</div></div>

      <div class="metric"><div class="metric-label">Chamadas de IA</div><div class="metric-value">3.412</div><div class="metric-sub">Hoje</div></div>

        ${[["API backend","Operacional","tag-ok"],["Microsserviço IA / visão","Operacional","tag-ok"],["STT / TTS","Operacional","tag-ok"],["WebSocket / alertas","Operacional","tag-ok"],["Sensor MQTT broker","1 falha","tag-warn"],["Banco de dados","Operacional","tag-ok"]].map(([l,s,t])=>`
          <div class="row"><div style="flex:1;font-size:13px">${l}</div><span class="tag ${t}">${s}</span></div>`).join("")}
      </div>
      <div class="card">
        <div class="section-title">Últimas ações do sistema</div>

  return `

      ${currentProfile==="funcionario"?`<button class="btn-primary" onclick="goPage('nova')">+ Nova demanda</button>`:""}
